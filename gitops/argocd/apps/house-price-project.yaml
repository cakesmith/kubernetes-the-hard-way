apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: house-price
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/cakesmith/house-price-predictor.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: house-price
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
